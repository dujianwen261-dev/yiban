{% extends "base.html" %}
{% block title %}修改我的信息{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">修改联系方式</h4>
  <a class="btn btn-outline-secondary" href="{{ url_for('students.me') }}">返回</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <p class="text-muted small">
      只能修改手机号、邮箱、家庭住址。学号、姓名、班级等字段由管理员维护。
    </p>

    <form method="post" action="{{ url_for('students.edit_me') }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="phone">手机号</label>
          <input class="form-control" id="phone" name="phone" maxlength="11"
                 placeholder="11 位手机号" value="{{ student.phone or '' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label" for="email">邮箱</label>
          <input class="form-control" id="email" name="email" type="email" maxlength="50"
                 value="{{ student.email or '' }}">
        </div>

        <div class="col-12">
          <label class="form-label" for="address">家庭住址</label>
          <input class="form-control" id="address" name="address" maxlength="200"
                 value="{{ student.address or '' }}">
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary" type="submit">保存</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('students.me') }}">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
